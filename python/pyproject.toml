[project]
name = "causalclaw-python"
version = "0.1.0"
description = "Python bridge for CausalClaw causal analysis tools"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0",  # causal-learn has compatibility issues with numpy 2.0+
    "pandas",
    "scipy",
    "scikit-learn",
    "causal-learn>=0.1.3",  # Ensure a version with better numpy compatibility
    "lingam",
    "dowhy",
    "clingo>=5.8,<6",
]
